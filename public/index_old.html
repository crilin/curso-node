<!DOCTYPE html>
<html lang="en">
  <head>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    
    <script src="https://accounts.google.com/gsi/client" async></script>
    
    <script src="./js/auth-google.js"></script>
    <script src="https://kit.fontawesome.com/17bc41cc06.js" crossorigin="anonymous"></script>
  </head>
  <body class="container">

    <div class="row mt-5">
      <div class="col-sm-6">
        <h1><i class="fa-brands fa-google" style="color: #e40707;"></i>Sing In</h1>
        <hr>
        <div
          id="g_id_onload"
          data-auto_prompt="false"
          data-callback="handleCredentialResponse"
          data-client_id="228704382436-ih59cm7o9851g9j9lrqqoe6gioi32tlt.apps.googleusercontent.com"
        ></div>
        <!-- g_id_signin places the button on a page and supports customization -->
        <div class="g_id_signin"></div>
        <br>
        <button class="btn btn-link rounded-pill px-3" onclick="google_signout()"> Signout</button>

      </div>

      <div class="col-sm-6">

        <h1><i class="fa-solid fa-user"></i>Login usuario</h1>
        
        <hr>

        <form class="d-grid">
          
          <input type="text" name="correo" class="form-control mb-2" placeholder="Correo" />
          <input type="text" name="password" class="form-control mb-2" placeholder="Password" />
  
          <button class="btn btn-primary">Ingresar</button>
        </form>
      </div>
    </div>
    <!-- g_id_onload contains Google Identity Services settings -->
    <script src="./js/auth-local.js"></script>
  </body>
</html>
