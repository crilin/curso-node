<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat EJT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://kit.fontawesome.com/17bc41cc06.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/showdown/2.1.0/showdown.min.js" integrity="sha512-LhccdVNGe2QMEfI3x4DVV3ckMRe36TfydKss6mJpdHjNFiV07dFpS2xzeZedptKZrwxfICJpez09iNioiSZ3hA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body class="container">
    
    <div class="row mt-5">

        <div class="col-sm-6">
            <h3>Enviar Mensaje <i class="fa-solid fa-pen fa-rotate-270" style="color: #ec7322;"></i></h3>
            <hr>
            <input  type="text"
                    id="txtUid"
                    class="form-control mb-2"
                    placeholder="uid"
                    autocomplete="off">

            <input  type="text"
                    id="txtMsg"
                    class="form-control mb-2"
                    placeholder="mensaje"
                    autocomplete="off">

            <br>
            <h3>Usuarios <i class="fa-solid fa-user" style="color: #198754;"></i></h3>
            <hr>
            <ul id="ulUsuarios"></ul>
        </div>

        <div class="col-sm-6">
            <h3>Chat Completo <i class="fa-solid fa-comments" style="color: #74C0FC;"></i></h3>
            <hr>
            <ul id="ulMensajes"></ul>
        </div>
    </div>

    <button id="btnSalir" class="btn btn-outline-danger">
        Logout
    </button>
    <script src="./socket.io/socket.io.js"></script>
    <script src="./js/chat.js"></script>

</body>
</html>
