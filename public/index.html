<!DOCTYPE html>
<html lang="en">
  <head>
    <script src="https://accounts.google.com/gsi/client" async></script>

    <script>
      function decodeJWT(token) {

        let base64Url = token.split(".")[1];
        let base64 = base64Url.replace(/-/g, "+").replace(/_/g, "/");
        let jsonPayload = decodeURIComponent(
          atob(base64)
            .split("")
            .map(function (c) {
              return "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2);
            })
            .join("")
        );
        return JSON.parse(jsonPayload);
      }

      function handleCredentialResponse(response) {

        // console.log("Encoded JWT ID token: " + response.credential);

        // const id_token = response.credential
        const body = { id_token: response.credential }

        // const responsePayload = decodeJWT(response.credential);

        // console.log("Decoded JWT ID token fields:");
        // console.log("  Full Name: " + responsePayload.name);
        // console.log("  Given Name: " + responsePayload.given_name);
        // console.log("  Family Name: " + responsePayload.family_name);
        // console.log("  Unique ID: " + responsePayload.sub);
        // console.log("  Profile image URL: " + responsePayload.picture);
        // console.log("  Email: " + responsePayload.email);

        fetch('http://localhost:3500/api/auth/google', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json'},
          body: JSON.stringify(body)
        })
          .then(resp => resp.json() )
          .then( resp => {
            console.log(resp);
            localStorage.setItem('g_email', resp.usuario.correo)
          })
          .catch( console.warn )
      }

    </script>
  </head>
  <body>
    <h1>Google Sing In</h1>
    <!-- g_id_onload contains Google Identity Services settings -->
    <div
      id="g_id_onload"
      data-auto_prompt="false"
      data-callback="handleCredentialResponse"
      data-client_id="228704382436-ih59cm7o9851g9j9lrqqoe6gioi32tlt.apps.googleusercontent.com"
    ></div>
    <!-- g_id_signin places the button on a page and supports customization -->
    <div class="g_id_signin"></div>
    <br>
    <button id="google_signout"> Signout</button>

    <script>

      // Maneja el cierre de sesión
      const button = document.getElementById('google_signout');

      button.onclick = () => {

        console.log(google.accounts.id);
        google.accounts.id.disableAutoSelect();

        google.accounts.id.revoke( localStorage.getItem('g_email'), done => {
          localStorage.clear();
          location.reload();
        })
      }

    </script>
  </body>
</html>
